  </defs>

  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#chasis)" stroke="#3A2F26" stroke-width="1.5"/>

  <!-- Arcos de emisión -->
  <g fill="none" stroke="#E8A93C" stroke-linecap="round" opacity="0.85">
    <path d="M20 24a17 17 0 0 0 0 16" stroke-width="2.6"/>
    <path d="M44 24a17 17 0 0 1 0 16" stroke-width="2.6"/>
    <path d="M13.5 18a26 26 0 0 0 0 28" stroke-width="2" opacity="0.45"/>
    <path d="M50.5 18a26 26 0 0 1 0 28" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- Testigo al aire -->
  <circle cx="32" cy="32" r="9" fill="#FF3B21" opacity="0.55" filter="url(#halo)"/>
  <circle cx="32" cy="32" r="8" fill="url(#lampara)" stroke="#FF7A5E" stroke-width="1"/>
</svg>
