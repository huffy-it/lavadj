<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chasis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221C17"/>
      <stop offset="1" stop-color="#0E0B0A"/>
    </linearGradient>
    <radialGradient id="lampara" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#FFC3AE"/>
      <stop offset="0.5" stop-color="#FF3B21"/>
      <stop offset="1" stop-color="#A81C09"/>
    </radialGradient>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
