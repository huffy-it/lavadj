<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LavaDJ</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --fg:#e6e8eb; --mut:#8b929c; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1f24; --mut:#6a7280; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:900px; margin:auto; display:grid; gap:12px; }
  h1 { margin:0 0 4px; font-size:20px; display:flex; align-items:center; gap:10px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); display:inline-block; }
  .ok { background:var(--ok); } .warn { background:var(--warn); } .bad { background:var(--bad); }
  .row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .row span:first-child { color:var(--mut); }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 14px; font:inherit; cursor:pointer; }
  button.bad { background:var(--bad); } button:disabled { opacity:.5; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=range] { flex:1; min-width:120px; }
  ul { margin:0; padding-left:18px; } li.leido { color:var(--mut); text-decoration:line-through; }
  pre { margin:0; max-height:300px; overflow:auto; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  .pais { margin:10px 0 2px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  .voz { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px 12px; padding:3px 0; }
  .voz small { color:var(--mut); } .voz .uso { color:var(--ok); font-weight:600; }
  .voz .botones { display:flex; gap:6px; align-items:center; }
  .voz button { padding:3px 10px; } button.sec { background:transparent; color:var(--fg); border:1px solid var(--mut); }
  .voz progress { width:90px; } .err { color:var(--bad); font-size:13px; }
  .guion { display:flex; align-items:center; gap:8px; padding:3px 0; } .guion small { color:var(--mut); }
  .letra summary { cursor:pointer; list-style:none; display:flex; align-items:baseline; gap:8px; }
  .letra summary::-webkit-details-marker { display:none; }
  .letra summary::before { content:'▸'; color:var(--mut); font-size:12px; } .letra[open] summary::before { content:'▾'; }
  .letra summary h2 { margin:0; } .letra summary small { color:var(--mut); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #letraCaja { position:relative; max-height:260px; overflow:auto; margin-top:8px; }
  #letraCaja p { margin:0; padding:2px 0; }
  #letraCaja.sync p { color:var(--mut); transition:color .2s; } #letraCaja.sync p.on { color:var(--fg); font-weight:600; }
  #letraCaja.sync p:empty::before { content:'♪'; } #letraCaja.plana p:empty { height:.8em; }
</style>
</head>
<body>
<main>
  <h1><span id="luz" class="dot"></span> LavaDJ <small id="usuario" style="color:var(--mut);font-weight:400"></small></h1>

  <div class="card">
    <h2>Estado</h2>
    <div class="row"><span>Bot</span><span id="bot">…</span></div>
    <div class="row"><span>Lavalink (audio)</span><span id="lava">…</span></div>
    <div class="row"><span>Transmisión</span><span id="salud">…</span></div>
    <div class="row"><span>yt-dlp</span><span id="ytdlp">…</span></div>
    <div class="row"><span>Servidores</span><span id="servidores">…</span></div>
  </div>

  <div class="card"><h2>En el aire</h2><div id="voz">Nada.</div></div>

  <div class="card">
    <details id="letraDet" class="letra" open>
      <summary><h2>Letra</h2><small id="letraTit"></small></summary>
      <div id="letraCaja"><p>Nada sonando.</p></div>
    </details>
  </div>

  <div class="card">
    <h2>Voz del DJ</h2>
    <div class="acciones">
      <input id="vol" type="range" min="0" max="200" step="5">
      <b id="volTxt">–</b>
    </div>
    <label class="row"><span>Filtro de radio</span><input id="filtro" type="checkbox"></label>
    <div id="sinPiper" class="err" hidden>Falta Piper, el motor de las voces neuronales: instálalo con <code>pip install piper-tts</code> en el venv del bot y reinicia.</div>
    <div id="voces"></div>
    <div id="vocesError" class="err"></div>
    <audio id="muestra"></audio>
  </div>

  <div class="card">
    <h2>Guionista del DJ</h2>
    <div id="guionistas"></div>
    <div id="guionistaFallo" class="err"></div>
    <div id="guionistaError" class="err"></div>
  </div>

  <div class="card">
    <h2>Titulares del DJ</h2>
    <div class="acciones" style="margin-bottom:8px">
      <button id="refrescar">Refrescar noticias</button><span id="edad" style="color:var(--mut)"></span>
    </div>
    <ul id="titulares"></ul>
  </div>

  <div class="card">
    <h2>Log</h2>
    <pre id="log">…</pre>
  </div>

  <div class="card acciones"><button id="parar" class="bad">Apagar el bot</button></div>
</main>
<script>
const $ = id => document.getElementById(id);
const api = (ruta, opts) => fetch('/api/' + ruta, opts).then(r => r.json());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur = s => s < 60 ? s + ' s' : s < 3600 ? Math.floor(s/60) + ' min' : Math.floor(s/3600) + ' h ' + Math.floor(s%3600/60) + ' min';
let moviendo = false;

async function actualizar() {
  try {
    const e = await api('status');
    $('luz').className = 'dot ' + (e.salud && e.salud.estado === 'bien' && e.lavalink.conectado ? 'ok' : 'warn');
    $('usuario').textContent = e.usuario || '';
    $('bot').textContent = (e.listo ? 'listo' : 'arrancando') + ' · ' + dur(Math.floor(e.uptime));
    $('lava').textContent = e.lavalink.conectado ? 'conectado' : 'DESCONECTADO';
    $('salud').textContent = e.salud ? e.salud.estado + (e.salud.motivo ? ' – ' + e.salud.motivo : '') : '–';
    const y = e.ytdlp;
    let textoYtdlp = y.version ? y.version + (y.viejo ? ' (viejo)' : '') : 'no encontrado';
    if (y.cliente && y.cliente !== y.cliente_configurado) textoYtdlp += ' · cliente ' + y.cliente + ' (cambiado solo)';
    $('ytdlp').textContent = textoYtdlp;
    $('servidores').textContent = e.servidores;
    $('voz').innerHTML = e.voz.length ? e.voz.map(v =>
      `<div class="row"><span>${esc(v.servidor)} · ${esc(v.canal || '')}</span><span>${v.sonando ? '▶ ' + esc(v.cancion || '') : 'quieto'} · ${v.en_cola} en cola</span></div>`).join('') : 'Nada.';
    try { seguirLetra(e.voz); } catch (_) {}    // que la letra falle no es que el bot esté apagado
  } catch (_) {
    $('luz').className = 'dot bad'; $('bot').textContent = 'APAGADO';
    return;
  }
  try {
    const d = await api('dj_volume');
    if (!moviendo) { $('vol').value = d.volumen; $('volTxt').textContent = d.volumen + '%' + (d.disponible ? '' : ' (DJ no disponible)'); }
    if (!sondeoVoces) await cargarVoces();
    const h = await api('headlines');
    $('edad').textContent = h.edad == null ? 'sin bajar' : 'hace ' + dur(Math.floor(h.edad));
    $('titulares').innerHTML = (h.titulares || []).map(t => `<li class="${t.leido ? 'leido' : ''}">${esc(t.texto)}</li>`).join('');
    const l = await api('log?lineas=60');
    const caja = $('log'), abajo = caja.scrollTop + caja.clientHeight >= caja.scrollHeight - 20;
    caja.textContent = l.lineas.join('\n');
    if (abajo) caja.scrollTop = caja.scrollHeight;
    await cargarGuionista();    // al final: preguntar si Ollama responde puede tardar y no debe frenar lo demás
  } catch (_) {}
}

$('vol').oninput = () => { moviendo = true; $('volTxt').textContent = $('vol').value + '%'; };
$('vol').onchange = async () => { await api('dj_volume?valor=' + $('vol').value, {method:'POST'}); moviendo = false; };
$('refrescar').onclick = async () => { $('refrescar').disabled = true; await api('refresh_news', {method:'POST'}); $('refrescar').disabled = false; actualizar(); };
// Sin confirm(): los navegadores embebidos lo bloquean y el botón parecía muerto.
let armado = null;
$('parar').onclick = async () => {
  const b = $('parar');
  if (!armado) {
    b.textContent = 'Click otra vez para confirmar';
    armado = setTimeout(() => { armado = null; b.textContent = 'Apagar el bot'; }, 4000);
    return;
  }
  clearTimeout(armado); armado = null;
  b.disabled = true; b.textContent = 'Apagando…';
  try { await api('stop?motivo=panel+web', {method:'POST'}); } catch (_) {}
  setTimeout(actualizar, 1500);
};

const CALIDAD = {x_low:'muy baja', low:'baja', medium:'media', high:'alta'};
let datosVoces = null, vistaVoces = '', escuchando = null, sondeoVoces = null;

function pintarVoces() {
  const d = datosVoces;
  if (!d) return;
  $('sinPiper').hidden = d.piper;
  $('filtro').checked = d.filtro_radio;
  const grupos = {};
  d.voces.forEach(v => (grupos[v.pais || 'De siempre'] = grupos[v.pais || 'De siempre'] || []).push(v));
  const boton = (a, v, texto, clase = '') => `<button class="${clase}" data-a="${a}" data-v="${esc(v.id)}">${texto}</button>`;
  const vista = Object.entries(grupos).map(([pais, lista]) => `<div class="pais">${esc(pais)}</div>` + lista.map(v => {
    const detalle = v.calidad ? ` <small>${esc(CALIDAD[v.calidad] || v.calidad)} · ${Math.round(v.tamano / 1e6)} MB</small>` : '';
    let acciones = boton('escuchar', v, escuchando === v.id ? '…' : '▶ Escuchar', 'sec');
    if (v.descargando) acciones += `<progress max="100" value="${v.progreso || 0}"></progress> ${v.progreso || 0}%`;
    else if (!v.instalada) acciones += boton('descargar', v, 'Descargar');
    else {
      if (!v.en_uso) acciones += boton('usar', v, 'Usar');
      if (!v.en_uso && v.calidad) acciones += boton('borrar', v, 'Borrar', 'bad');
    }
    return `<div class="voz"><span>${esc(v.nombre || 'espeak')}${detalle}${v.en_uso ? ' <span class="uso">· en uso</span>' : ''}` +
      `${v.error ? `<br><span class="err">${esc(v.error)}</span>` : ''}</span><span class="botones">${acciones}</span></div>`;
  }).join('')).join('');
  if (vista !== vistaVoces) { vistaVoces = vista; $('voces').innerHTML = vista; }   // sin rehacerla igual: un click a medias se perdería
}

async function cargarVoces(datos) {
  datosVoces = datos || await api('voces');
  pintarVoces();
  clearTimeout(sondeoVoces);
  // Mientras algo se baja, el progreso se mira cada segundo y no cada 3.
  sondeoVoces = datosVoces.voces.some(v => v.descargando) ? setTimeout(() => cargarVoces().catch(() => { sondeoVoces = null; }), 1000) : null;
}

async function accionDeVoz(accion, id) {
  const ruta = {usar: 'voz', descargar: 'voces/descargar', borrar: 'voces/borrar'}[accion];
  const r = await api(ruta + '?voz=' + encodeURIComponent(id), {method:'POST'});
  $('vocesError').textContent = r.error || '';
  if (!r.error) cargarVoces(r);
}

$('voces').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.a !== 'escuchar') return accionDeVoz(b.dataset.a, b.dataset.v).catch(err => { $('vocesError').textContent = err.message; });
  if (escuchando) return;    // una muestra a la vez: cada una lanza Piper
  escuchando = b.dataset.v; $('vocesError').textContent = ''; pintarVoces();
  $('muestra').src = '/api/voces/muestra?voz=' + encodeURIComponent(escuchando) + '&t=' + Date.now();
  $('muestra').play().catch(() => {});    // si falla, lo cuenta onerror
};
$('muestra').onplaying = () => { escuchando = null; pintarVoces(); };
$('muestra').onerror = () => { if (escuchando) $('vocesError').textContent = 'No pude reproducir la muestra de esa voz.'; escuchando = null; pintarVoces(); };
$('filtro').onchange = async () => {
  const r = await api('voz/filtro?activo=' + ($('filtro').checked ? 1 : 0), {method:'POST'});
  $('vocesError').textContent = r.error || '';
  cargarVoces(r.error ? null : r);
};

const GUIONISTAS = [['frases', 'Frases fijas'], ['claude', 'Claude (API, cobra por uso)'], ['ollama', 'Ollama (local)']];
const SIN_GUIONISTA = {claude: 'falta el SDK de anthropic', ollama: 'no responde'};
let vistaGuionistas = '';

async function cargarGuionista(datos) {
  const d = datos || await api('guionista');
  if (d.error) { $('guionistaFallo').textContent = d.error; return; }
  $('guionistaFallo').textContent = d.ultimo_error || '';
  const vista = GUIONISTAS.map(([id, nombre]) => {
    const ok = d.disponibles[id], nota = [(d.modelos || {})[id], ok ? '' : SIN_GUIONISTA[id]].filter(Boolean).join(' · ');
    return `<label class="guion"><input type="radio" name="guionista" value="${id}"${d.activo === id ? ' checked' : ''}${ok ? '' : ' disabled'}>` +
      `<span>${nombre}${nota ? ` <small>${esc(nota)}</small>` : ''}</span></label>`;
  }).join('');
  if (vista !== vistaGuionistas) { vistaGuionistas = vista; $('guionistas').innerHTML = vista; }
}

$('guionistas').onchange = async e => {
  try {
    const r = await api('guionista?nombre=' + encodeURIComponent(e.target.value), {method:'POST'});
    $('guionistaError').textContent = r.error || '';
    vistaGuionistas = '';    // tras un error el radio quedó marcado de más: se repinta con lo que hay de verdad
    await cargarGuionista(r.error ? null : r);
  } catch (err) { $('guionistaError').textContent = err.message; }
};

const caja = $('letraCaja'), det = $('letraDet');
const AVISOS = {sin_letra: 'No encontré la letra de esta canción.', error: 'No pude buscar la letra.'};
let letra = {pista: null, sync: false, lineas: []}, pedida = null, ancla = null, activa = -1, sala = null, libre = 0;

function avisoLetra(texto) { caja.className = ''; caja.innerHTML = `<p>${esc(texto)}</p>`; }

function pintarLetra(r) {
  letra = {pista: r.pista, sync: r.sincronizada, lineas: r.lineas};
  activa = -1;
  if (!r.lineas.length) return avisoLetra(AVISOS[r.motivo] || 'Sin letra.');
  caja.className = r.sincronizada ? 'sync' : 'plana';
  caja.innerHTML = r.lineas.map(l => `<p>${esc(l.texto)}</p>`).join('');
  caja.scrollTop = 0;
}

// La letra se pide solo cuando cambia la pista; la posición entre sondeos se interpola en `resaltar`.
async function pedirLetra(v) {
  if (!det.open || pedida === v.pista) return;
  pedida = v.pista; ancla = null; letra = {pista: null, sync: false, lineas: []};
  $('letraTit').textContent = v.cancion || '';
  avisoLetra('Buscando la letra…');
  try {
    const r = await api('letra?servidor=' + encodeURIComponent(v.id));
    if (r.pista !== pedida) { pedida = null; return; }    // cambió mientras se buscaba: el próximo sondeo la pide otra vez
    ancla = {pos: r.posicion_ms, t: performance.now(), pausado: r.pausado};
    pintarLetra(r);
  } catch (_) { pedida = null; }
}

function seguirLetra(voz) {
  sala = voz.find(v => v.sonando) || null;
  if (!sala) { pedida = null; ancla = null; letra.pista = null; $('letraTit').textContent = ''; return avisoLetra('Nada sonando.'); }
  if (sala.dj) { ancla = null; return; }    // habla el locutor: la letra se queda donde estaba
  if (sala.pista === letra.pista) ancla = {pos: sala.posicion_ms, t: performance.now(), pausado: sala.pausado};
  else pedirLetra(sala);
}

function resaltar(forzar) {
  if (!ancla || !letra.sync || !det.open || !caja.children.length) return;
  const pos = ancla.pausado ? ancla.pos : ancla.pos + performance.now() - ancla.t, ls = letra.lineas;
  let lo = 0, hi = ls.length - 1, i = -1;    // la última línea con ms <= pos
  while (lo <= hi) { const m = (lo + hi) >> 1; if (ls[m].ms <= pos) { i = m; lo = m + 1; } else hi = m - 1; }
  if (i === activa && !forzar) return;
  const ps = caja.children;
  if (ps[activa]) ps[activa].classList.remove('on');
  activa = i;
  if (!ps[i]) return;
  ps[i].classList.add('on');
  // Dentro de la tarjeta (scrollIntoView movería toda la página); quien rueda a mano no es arrastrado de vuelta.
  if (performance.now() > libre) caja.scrollTo({top: ps[i].offsetTop - (caja.clientHeight - ps[i].offsetHeight) / 2, behavior: 'smooth'});
}

const bucle = () => { resaltar(); requestAnimationFrame(bucle); };
const soltar = () => { libre = performance.now() + 4000; };
caja.addEventListener('wheel', soltar, {passive: true}); caja.addEventListener('touchmove', soltar, {passive: true});
try { det.open = localStorage.getItem('lavadj.letra') !== '0'; } catch (_) {}
det.ontoggle = () => {
  try { localStorage.setItem('lavadj.letra', det.open ? '1' : '0'); } catch (_) {}
  if (det.open && sala) { pedirLetra(sala); resaltar(true); }
};
requestAnimationFrame(bucle);

actualizar(); setInterval(() => { if (!document.hidden) actualizar(); }, 3000);
</script>
</body>
</html>
